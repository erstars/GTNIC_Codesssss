<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1500" viewBox="0 0 1120 1500" font-family="Segoe UI, Inter, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#25332e"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b94b45"/>
  </marker>
</defs>
<rect width="1120" height="1500" fill="#ffffff"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#25332e">Alur Transaksi Penjualan (Kasir)</text><text x="40" y="70" font-size="13.5" fill="#6f7b75">Harga, stok, dan total selalu dihitung ulang oleh server sebelum disimpan</text><rect x="30" y="80" width="520" height="1390" rx="14" fill="#edf4ef" stroke="#c9dbd0"/><rect x="570" y="80" width="520" height="1390" rx="14" fill="#eaf2f7" stroke="#cfe0ea"/><text x="290" y="108" font-size="14" font-weight="700" fill="#2c5243" text-anchor="middle" dominant-baseline="middle">BROWSER — lomba.js</text><text x="830" y="108" font-size="14" font-weight="700" fill="#3f6f8f" text-anchor="middle" dominant-baseline="middle">SERVER — server.js + PostgreSQL</text><rect x="140" y="136" width="300" height="48" rx="24" fill="#47745e" stroke="#47745e" stroke-width="1.5"/><text x="290" y="160" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Mulai: kasir membuka halaman Kasir</text><path d="M290,184 L290,220" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="125" y="222" width="330" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="290" y="243.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Pilih produk, cari nama,</text><text x="290" y="260.58" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">atau pindai barcode lalu Enter</text><path d="M290,282 L290,318" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="125" y="320" width="330" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="290" y="341.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Masuk keranjang</text><text x="290" y="358.58000000000004" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">(jumlah dibatasi stok tersedia)</text><path d="M290,380 L290,416" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="125" y="418" width="330" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="290" y="439.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Isi diskon (Rp) dan pilih metode:</text><text x="290" y="456.58000000000004" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Tunai / QRIS / Transfer</text><path d="M290,478 L290,514" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><polygon points="290,515 385,560 290,605 195,560" fill="#fbf3e4" stroke="#a06a1a" stroke-width="1.5"/><text x="290" y="560" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Tunai?</text><path d="M290,605 L290,644" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="306" y="628" font-size="12.5" fill="#6f7b75" text-anchor="start" font-weight="600">Ya</text><rect x="140" y="646" width="300" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="290" y="667.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Isi uang diterima</text><text x="290" y="684.5799999999999" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">(atau tombol uang cepat)</text><path d="M385,560 L480,560 L480,740 L400,790" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="470" y="548" font-size="12.5" fill="#6f7b75" text-anchor="end" font-weight="600">Tidak (bayar pas)</text><path d="M290,706 L290,744" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><polygon points="290,746 415,800 290,854 165,800" fill="#fbf3e4" stroke="#a06a1a" stroke-width="1.5"/><text x="290" y="791.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Diskon ≤ subtotal</text><text x="290" y="808.5799999999999" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">dan uang cukup?</text><path d="M165,800 L70,800 L70,448 L125,448" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrowRed)"/><text x="78" y="815.75" font-size="12.5" font-weight="600" fill="#b94b45" text-anchor="start" dominant-baseline="middle">Tidak:</text><text x="78" y="832.25" font-size="12.5" font-weight="600" fill="#b94b45" text-anchor="start" dominant-baseline="middle">muncul pesan</text><path d="M290,854 L290,894" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="306" y="878" font-size="12.5" fill="#6f7b75" text-anchor="start" font-weight="600">Ya</text><rect x="125" y="896" width="330" height="64" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="290" y="919.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Klik "Selesaikan transaksi"</text><text x="290" y="936.5799999999999" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">dibuat ID unik (anti klik dua kali)</text><path d="M455,928 L665,928" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="560" y="916" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">POST /api/sales</text><rect x="665" y="896" width="330" height="64" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="830" y="919.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Cek sesi login &amp; validasi input</text><text x="830" y="936.5799999999999" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">(jumlah, diskon, metode)</text><path d="M830,960 L830,994" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="665" y="994" width="330" height="64" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="830" y="1017.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">BEGIN — jika ID sudah tersimpan,</text><text x="830" y="1034.58" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">kembalikan data lama (tidak dobel)</text><path d="M830,1058 L830,1092" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="665" y="1092" width="330" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="830" y="1113.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Kunci baris produk</text><text x="830" y="1130.5800000000002" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">SELECT … FOR UPDATE</text><path d="M830,1152 L830,1178" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><polygon points="790,1178 905,1222 790,1266 675,1222" fill="#fbf3e4" stroke="#a06a1a" stroke-width="1.5"/><text x="790" y="1213.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Produk ada &amp;</text><text x="790" y="1230.5800000000002" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">stok cukup?</text><rect x="925" y="1187" width="150" height="70" rx="10" fill="#fbefed" stroke="#b94b45" stroke-width="1.5"/><text x="1000" y="1205.5" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">ROLLBACK,</text><text x="1000" y="1222" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">kirim pesan</text><text x="1000" y="1238.5" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">error ke kasir</text><path d="M905,1222 L924,1222" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrowRed)"/><text x="900" y="1212" font-size="12.5" fill="#b94b45" text-anchor="middle" font-weight="600">Tidak</text><path d="M790,1266 L790,1296" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="806" y="1286" font-size="12.5" fill="#6f7b75" text-anchor="start" font-weight="600">Ya</text><rect x="655" y="1298" width="350" height="60" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="830" y="1319.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Hitung total &amp; kembalian dari harga</text><text x="830" y="1336.5800000000002" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">database · simpan transaksi &amp; rincian</text><path d="M830,1358 L830,1386" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="655" y="1390" width="350" height="56" rx="10" fill="#ffffff" stroke="#3f6f8f" stroke-width="1.5"/><text x="830" y="1409.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Kurangi stok + catat riwayat stok</text><text x="830" y="1426.5800000000002" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">COMMIT</text><path d="M655,1418 L455,1418" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="560" y="1406" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">berhasil</text><rect x="125" y="1390" width="330" height="56" rx="10" fill="#47745e" stroke="#47745e" stroke-width="1.5"/><text x="290" y="1409.42" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Muat ulang data (GET /api/data)</text><text x="290" y="1426.5800000000002" font-size="13" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">lalu tampilkan struk → Cetak</text>
</svg>