<rect width="1360" height="730" fill="#ffffff"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#25332e">Arsitektur Sistem UsahaCerdas</text><text x="40" y="70" font-size="13.5" fill="#6f7b75">Aplikasi web tiga lapis: browser (frontend), server Node.js (backend), dan PostgreSQL (basis data)</text><text x="150" y="112" font-size="13" font-weight="700" fill="#6f7b75" text-anchor="middle">PENGGUNA</text><rect x="45" y="133" width="210" height="54" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="150" y="151.09" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Pemilik (Owner)</text><text x="150" y="168.91" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">akses penuh</text><rect x="45" y="209" width="210" height="54" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="150" y="227.09" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Staf / Kasir</text><text x="150" y="244.91" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">kasir, produk, riwayat</text><rect x="45" y="325" width="210" height="110" rx="10" fill="#edf4ef" stroke="#47745e" stroke-width="1.5"/><text x="150" y="361.52" font-size="14" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Browser</text><text x="150" y="380" font-size="14" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Chrome / Edge</text><text x="150" y="398.47999999999996" font-size="14" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Komputer atau HP</text><path d="M150,263 L150,323" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><line x1="150" y1="187" x2="150" y2="209" stroke="#25332e" stroke-width="1.6"/><rect x="320" y="96" width="300" height="470" rx="14" fill="#edf4ef" stroke="#47745e" stroke-width="1.8"/><text x="470" y="124" font-size="14" font-weight="700" fill="#2c5243" text-anchor="middle" dominant-baseline="middle">FRONTEND (berjalan di browser)</text><rect x="342" y="152" width="256" height="76" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="470" y="172.84" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">lomba.html</text><text x="470" y="190" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">struktur 7 halaman, dialog,</text><text x="470" y="207.16" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">layar loading</text><rect x="342" y="252" width="256" height="76" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="470" y="272.84" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">lomba.css</text><text x="470" y="290" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">tampilan, tema gelap,</text><text x="470" y="307.15999999999997" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">responsif HP, animasi</text><rect x="342" y="350" width="256" height="100" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="470" y="374.26" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">lomba.js</text><text x="470" y="391.42" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">keranjang, grafik, laporan,</text><text x="470" y="408.58" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">pemilih tanggal, CSV,</text><text x="470" y="425.74" font-size="13" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">pemanggilan API (fetch)</text><text x="470" y="482.08" font-size="12" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">HTML5 · CSS3 · JavaScript ES6+</text><text x="470" y="497.91999999999996" font-size="12" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">Ikon SVG · Font Inter (Google Fonts)</text><path d="M255,380 L316,380" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="287" y="370" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">membuka</text><rect x="700" y="96" width="320" height="470" rx="14" fill="#eaf2f7" stroke="#3f6f8f" stroke-width="1.8"/><text x="860" y="124" font-size="14" font-weight="700" fill="#3f6f8f" text-anchor="middle" dominant-baseline="middle">BACKEND — server.js (Node.js)</text><rect x="725" y="142" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="159.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Penyaji file statis</text><text x="860" y="176.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">hanya file yang diizinkan</text><rect x="725" y="206" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="223.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Router REST API /api/*</text><text x="860" y="240.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">JSON masuk &amp; keluar</text><rect x="725" y="270" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="287.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Autentikasi &amp; sesi</text><text x="860" y="304.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">scrypt, token SHA-256, cookie</text><rect x="725" y="334" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="351.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Otorisasi peran</text><text x="860" y="368.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Pemilik / Staf</text><rect x="725" y="398" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="415.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Validasi input</text><text x="860" y="432.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">angka, teks, tanggal</text><rect x="725" y="462" width="270" height="52" rx="10" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="860" y="479.75" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">Logika bisnis</text><text x="860" y="496.25" font-size="12.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">transaksi DB, kunci stok</text><path d="M624,250 L696,250" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="660" y="240" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">HTTP / JSON</text><path d="M696,300 L624,300" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="660" y="318" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">respons</text><text x="660" y="329.82" font-size="11.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">fetch()</text><text x="660" y="345" font-size="11.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">+ cookie sesi</text><text x="660" y="360.18" font-size="11.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">HttpOnly</text><path d="M1100,138 v384 a110,18 0 0 0 220,0 v-384" fill="#f6f7f3" stroke="#2c5243" stroke-width="1.8"/><ellipse cx="1210" cy="138" rx="110" ry="18" fill="#ffffff" stroke="#2c5243" stroke-width="1.8"/><text x="1210" y="184" font-size="16" font-weight="700" fill="#2c5243" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text><text x="1210" y="208" font-size="12.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">database: usahacerdas</text><text x="1210" y="248" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">users</text><text x="1210" y="278" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">sessions</text><text x="1210" y="308" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">store_settings</text><text x="1210" y="338" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">products</text><text x="1210" y="368" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">transactions</text><text x="1210" y="398" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">transaction_items</text><text x="1210" y="428" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">stock_movements</text><text x="1210" y="458" font-size="13.5" font-weight="400" fill="#25332e" text-anchor="middle" dominant-baseline="middle">expenses</text><text x="1210" y="488" font-size="13.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">view: transaction_totals</text><path d="M1024,330 L1096,330" fill="none" stroke="#25332e" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1060" y="318" font-size="12.5" fill="#6f7b75" text-anchor="middle" font-weight="600">SQL</text><text x="1060" y="350.41" font-size="11.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">berparameter</text><text x="1060" y="365.59000000000003" font-size="11.5" font-weight="400" fill="#6f7b75" text-anchor="middle" dominant-baseline="middle">driver pg (Pool)</text><rect x="40" y="600" width="1280" height="104" rx="12" fill="#ffffff" stroke="#c9dbd0" stroke-width="1.5"/><text x="60" y="628" font-size="13.5" font-weight="700" fill="#25332e" text-anchor="start" dominant-baseline="middle">Konfigurasi &amp; berkas pendukung</text><text x="60" y="656" font-size="12.5" font-weight="400" fill="#6f7b75" text-anchor="start" dominant-baseline="middle">• .env: DATABASE_URL (koneksi &amp; kata sandi database), PORT, HOST   • database/schema.sql (membuat tabel), upgrade.sql (memperbarui), demo.js (data contoh)</text><text x="60" y="682" font-size="12.5" font-weight="400" fill="#6f7b75" text-anchor="start" dominant-baseline="middle">• Akses: http://localhost:3000 (PC sendiri) · npm run start:wifi (HP di Wi-Fi yang sama) · VS Code Ports (tautan HTTPS untuk dibagikan)</text>
</svg>